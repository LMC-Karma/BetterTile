name: Website checks

on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm run build
      - name: Check that the site shows the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site=$(jq -r '.latest.tag' release.json)
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          echo "release.json: $site"
          echo "Latest GitHub release: $latest"
          if [ "$site" != "$latest" ]; then
            echo "::error title=Website shows an old release::release.json lists $site, but the latest release is $latest. Run 'npm run release', then 'npm run build', and publish the result."
            exit 1
          fi
