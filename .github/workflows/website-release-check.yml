name: Website release check

# The website's Download buttons come from release.json on the gh-pages
# branch. This check fails when that file lists an older release than the
# latest GitHub release. It lives on main because GitHub runs scheduled
# workflows only from the default branch. It checks out no code.
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare the website release with the latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site=$(gh api "repos/$GITHUB_REPOSITORY/contents/release.json?ref=gh-pages" \
            --jq '.content' | base64 -d | jq -r '.latest.tag')
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName')
          echo "Website release.json: $site"
          echo "Latest GitHub release: $latest"
          if [ "$site" != "$latest" ]; then
            echo "::error title=Website shows an old release::release.json on gh-pages lists $site, but the latest release is $latest. Follow 'Update the website' in docs/RELEASING.md."
            exit 1
          fi
