name: Claude Code Review

# Runs an automatic AI review when a non-draft pull request is opened, marked
# ready for review, or receives new commits.
# You can also mention @claude in a PR comment to ask follow-up questions — see the
# `claude-mention` job below.

on:
  pull_request:
    types: [ready_for_review, opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    # Automatic review: only for non-draft PRs from the base repo. Fork PRs are
    # skipped because GitHub withholds secrets from fork-triggered pull_request
    # runs, so CLAUDE_CODE_OAUTH_TOKEN would be empty and the job would fail with
    # a confusing red X on every external contributor's PR.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          # Uses a Claude subscription (Pro/Max) via OAuth — no API credits.
          # Generate the token with `claude setup-token` and store it as a repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in the
            repository ${{ github.repository }}. It is a native macOS window manager
            (Swift 6.3, SwiftUI, AppKit, public Accessibility API).

            Post inline comments on specific problem lines using the
            create_inline_comment tool, then post one short overall summary with
            `gh pr comment`. Prioritise:

            - Layer boundary: BetterTileCore must not import AppKit or Accessibility.
            - Coordinate model: Core uses top-left logical points; AppKit's bottom-left
              coordinates are converted only at the BetterTileMacOS boundary.
            - All window mutations must go through the main-actor WindowCoordinator.
            - Missing tests for geometry, state transitions, migrations, or failure paths.
            - Disallowed changes: private Apple APIs, third-party dependencies, SIP
              workarounds, code injection, or a new permission.

            Skip trivial nits. If the change looks good, post a brief approving summary.
          # Grant the tools Claude needs to actually POST its review.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  claude-mention:
    # On-demand: respond when someone writes "@claude" in a PR/issue comment.
    #
    # The author_association gate is essential on a public repo: these events run
    # in the base-repo context with access to CLAUDE_CODE_OAUTH_TOKEN regardless
    # of who commented, so without it any GitHub user could burn the Claude
    # subscription quota (or attempt prompt injection) by writing "@claude".
    # Only the repo owner, org members, and invited collaborators may trigger it.
    if: >
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
