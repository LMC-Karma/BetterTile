name: Claude Code Review

# Runs an automatic AI review when a non-draft pull request is opened, marked
# ready for review, or receives new commits.
# You can also mention @claude in a PR comment to ask follow-up questions — see the
# `claude-mention` job below.

on:
  pull_request:
    types: [ready_for_review, opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    # Automatic review: only for non-draft PRs from the base repo. Fork PRs are
    # skipped because GitHub withholds secrets from fork-triggered pull_request
    # runs, so CLAUDE_CODE_OAUTH_TOKEN would be empty and the job would fail with
    # a confusing red X on every external contributor's PR.
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          # Uses a Claude subscription (Pro/Max) via OAuth — no API credits.
          # Generate the token with `claude setup-token` and store it as a repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}. Read its body and diff. Read AGENTS.md and
            each project document that AGENTS.md says is relevant to the change.

            Perform two checks:

            1. Goal: compare the diff with the problem, before, after, unchanged
               scope, and validation stated in the pull-request body. Check every
               affected entry path and reverse transition when they apply.
            2. Repository rules: compare the diff with BetterTile's architecture,
               security, test, and product limits.

            Confirm a problem from the diff and repository evidence before you
            comment. Use create_inline_comment to post an inline comment only on
            a changed line that has an actionable problem. Put one problem in
            each comment. Start with what can break or confuse a user, then give
            the evidence and required fix. Use plain technical English and terms
            from CONTEXT.md.

            Keep these repository rules in the review:

            - BetterTileCore imports no AppKit or Accessibility.
            - Core uses top-left logical points. BetterTileMacOS converts AppKit's
              bottom-left coordinates at its boundary.
            - Every window mutation goes through the main-actor WindowCoordinator.
            - Geometry, state transitions, migrations, and failure paths need tests.
            - BetterTile accepts no SIP workaround or code injection.
            - Private Apple APIs require a written design discussion, maintainer
              approval, product fit, compatibility tests, safe fallback, and the
              disclosure required by SECURITY.md. Public APIs remain the default.
            - The app delegate owns SPUStandardUpdaterController and implements
              SPUUpdaterDelegate. BetterTileCore has no updater API.

            SECURITY.md is the canonical policy for networking, privacy,
            permissions, privileged components, dependencies, distribution,
            updates, licensing, and user-data handling. For a finding in one of
            these areas, cite the relevant rule and verify the required benefit,
            review, tests, and disclosure.

            Do not expand the pull request with unrelated improvements. Do not
            report a tool or infrastructure failure as a code fault. Put missing
            validation, false alarms, and tool failures in the overall summary,
            separate from confirmed code faults.

            Skip trivial nits. After the inline comments, post one short overall
            summary with `gh pr comment`. If there are no confirmed problems, say
            that the change matches its stated goal and repository rules.
          # Grant the tools Claude needs to actually POST its review.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  claude-mention:
    # On-demand: respond when someone writes "@claude" in a PR/issue comment.
    #
    # The author_association gate is essential on a public repo: these events run
    # in the base-repo context with access to CLAUDE_CODE_OAUTH_TOKEN regardless
    # of who commented, so without it any GitHub user could burn the Claude
    # subscription quota (or attempt prompt injection) by writing "@claude".
    # Only the repo owner, org members, and invited collaborators may trigger it.
    if: >
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
