name: CI

on:
  pull_request:
  # A pull request is tested on its own branch. Two pull requests that each
  # pass can still break `main` together, so the merged result is tested too.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its older run. Other runs are grouped by
# commit, because a shared group keeps only the newest waiting run. That way
# each merge to `main` gets its own complete run, even when merges land close
# together.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `test` is a required status check. A workflow skipped by a `paths-ignore`
  # filter never reports that check at all, so the pull request waits on it
  # forever; a job skipped by an `if` condition reports success and satisfies
  # it. That is why the path decision lives here rather than in `on:`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Decide whether the change can affect a build
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Anything that is not a pull request (a push to `main` or a manual
          # dispatch) gets the full run.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # Everything not matched here is treated as code, so a path nobody
          # anticipated is built rather than silently skipped. Workflow files
          # are deliberately absent: a change to CI must still run CI.
          # LICENSE and THIRD_PARTY_NOTICES.md ship inside the app, and the
          # release tool checks the bundled copies, so they count as code.
          code=$(printf '%s\n' "$changed" \
            | grep -vE '(^docs/|^\.github/ISSUE_TEMPLATE/|\.md$)' \
            || true)
          bundled=$(printf '%s\n' "$changed" | grep -xE 'THIRD_PARTY_NOTICES\.md' || true)
          code="$code$bundled"

          if [ -n "$code" ]; then
            echo "Build-affecting paths changed, running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only, skipping the build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Swift version
        run: swift --version
      - name: Test
        shell: bash
        run: |
          # Separate processes keep AppKit rendering tests from delaying app-model tasks.
          for target in BetterTileCoreTests BetterTileMacOSTests BetterTileAppTests; do
            swift test --parallel --filter "$target"
          done

  release-package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Guards the `rm -rf` in the release tool's exit trap.
      - name: Test release workspace cleanup
        run: Tools/tests/release-workspace-test.sh
      - name: Test release appcast handling
        run: Tools/tests/release-appcast-test.sh
      - name: Test release signing policy
        run: Tools/tests/release-signing-policy-test.sh
      - name: Test release source target
        run: Tools/tests/release-source-test.sh
      - name: Test release bundled licenses
        run: Tools/tests/release-bundle-test.sh
      - name: Build release
        run: swift build -c release

  app-debug:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build application bundle
        run: xcodebuild -project BetterTile.xcodeproj -scheme BetterTile -configuration Debug CODE_SIGNING_ALLOWED=NO build

  app-release:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Release is what ships. It resolves BETTERTILE_ENABLE_AUTOMATIC_CHECKS
      # differently from Debug, so a Debug-only build cannot catch a broken
      # release configuration.
      - name: Build release application bundle
        run: xcodebuild -project BetterTile.xcodeproj -scheme BetterTile -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  # A job skipped because its dependency failed reports the same "skipped"
  # conclusion as one skipped by its own condition, and a skipped required
  # check counts as passing. Always run `test` to reject failed classification
  # and require every build and test job to match that classification.
  # Add every new job to `needs` so the required check covers it.
  # Keep `always()` rather than `!cancelled()`: a cancelled run must fail this
  # check, because a skipped required check counts as passing.
  test:
    needs: [changes, unit-tests, release-package, app-debug, app-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a successful change classification
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "The changes job ended as '$RESULT', so nothing establishes"
            echo "that this pull request is documentation only. Failing rather"
            echo "than letting the required check pass without a build."
            exit 1
          fi
      - name: Require the expected build and test results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          case "$CODE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo "Unexpected change classification: '$CODE'."; exit 1 ;;
          esac

          # Read every job in `needs` except `changes`, so a new job only has
          # to be added to `needs`.
          unexpected=$(jq -r --arg expected "$expected" \
            'to_entries[] | select(.key != "changes" and .value.result != $expected)
             | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$unexpected" ]; then
            echo "Expected every build and test job to be '$expected', got:"
            echo "$unexpected"
            exit 1
          fi
          echo "Every build and test job ended as '$expected'."
