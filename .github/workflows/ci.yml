name: CI

on:
  pull_request:
  # A pull request is tested on its own branch. Two pull requests that each
  # pass can still break `main` together, so the merged result is tested too.
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Full validation on main at 07:23 UTC, away from the top of the hour.
    - cron: "23 7 * * *"

permissions:
  contents: read

# A new push to a pull request replaces its older run. Other runs are grouped by
# commit, because a shared group keeps only the newest waiting run. That way
# each main commit keeps its run when merges land close together. Scheduled
# runs use the same per-commit group and never cancel an in-progress run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `test` is a required status check. A workflow skipped by a `paths-ignore`
  # filter never reports that check at all, so the pull request waits on it
  # forever; a job skipped by an `if` condition reports success and satisfies
  # it. That is why the path decision lives here rather than in `on:`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Decide whether the change can affect a build
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Classify pushes, scheduled runs and manual dispatches as code.
          # The app job separately skips pushes to main.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # Everything not matched here is treated as code, so a path nobody
          # anticipated is built rather than silently skipped. Workflow files
          # are deliberately absent: a change to CI must still run CI.
          # LICENSE and THIRD_PARTY_NOTICES.md ship inside the app, and the
          # release tool checks the bundled copies, so they count as code.
          code=$(printf '%s\n' "$changed" \
            | grep -vE '(^docs/|^\.github/ISSUE_TEMPLATE/|\.md$)' \
            || true)
          bundled=$(printf '%s\n' "$changed" | grep -xE 'THIRD_PARTY_NOTICES\.md' || true)
          code="$code$bundled"

          if [ -n "$code" ]; then
            echo "Build-affecting paths changed, running the full suite."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only, skipping the build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  guards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test the test timing guard
        run: Tools/tests/check-test-timing-test.sh
      - name: Test Metal Toolchain setup
        run: Tools/tests/setup-metal-test.sh
      - name: Check test timing and quarantine rules
        run: Tools/ci/check-test-timing.sh

      - name: Test runner recovery decision
        run: Tools/tests/rerun-unacquired-test.sh
      - name: Test test-run completion guard
        run: Tools/tests/test-completion-test.sh
      - name: Test release test-run completion guard
        run: Tools/tests/release-test-completion-test.sh
      - name: Test release source target
        run: Tools/tests/release-source-test.sh

      - name: Install XML tools for release appcast tests
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Test release appcast handling
        run: Tools/tests/release-appcast-test.sh
      - name: Test release signing policy
        run: Tools/tests/release-signing-policy-test.sh
      - name: Test release bundled licenses
        run: Tools/tests/release-bundle-test.sh
      - name: Test release Layout Wheel shader check
        run: Tools/tests/release-shader-test.sh

  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Metal Toolchain
        uses: ./.github/actions/setup-metal
      - name: Swift version
        run: swift --version
      - name: Identify Xcode for the build cache
        id: xcode
        shell: bash
        run: |
          version="$(xcodebuild -version)"
          printf '%s\n' "$version"
          fingerprint="$(printf '%s\n' "$version" | shasum -a 256 | cut -d ' ' -f 1)"
          echo "version=$fingerprint" >> "$GITHUB_OUTPUT"
      # Keep dependencies and toolchain fixed even for fallback restores.
      # Each commit can save fresh products; SwiftPM still builds current sources.
      - name: Restore SwiftPM Debug build
        id: swiftpm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # version 4
        with:
          path: .build
          key: swiftpm-build-1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-Debug-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-build-1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-Debug-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
      - name: Test
        env: { BETTERTILE_LOCAL_WINDOW_TESTS: "1" }
        shell: bash
        run: |
          # Separate processes keep AppKit rendering tests from delaying app-model tasks.
          failed=0
          for target in BetterTileCoreTests BetterTileMacOSTests BetterTileAppTests; do
            case "$target" in
              BetterTileCoreTests)
                unset SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH
                ;;
              BetterTileMacOSTests)
                # Bound native fixture contention while keeping rendering work parallel.
                export SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=8
                ;;
              BetterTileAppTests)
                # Bound window-fixture polling so event tasks can register their waits.
                # A wider cap preserves throughput while settings UI leases serialize snapshots.
                export SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH=32
                ;;
            esac
            if Tools/test.sh "$RUNNER_TEMP/$target.log" --expected-runs 1 --parallel --filter "$target"; then
              target_status=0
            else
              target_status=$?
              failed=1
            fi
            printf '%s: exit %s\n' "$target" "$target_status"
          done
          exit "$failed"
      # Prevent cache poisoning from pull requests: only trusted runs save.
      # Pushes to main, scheduled runs and manual dispatches qualify;
      # dispatch needs write access.
      - name: Save SwiftPM Debug build
        if: github.event_name != 'pull_request' && steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # version 4
        with:
          path: .build
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

  app:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push'
    runs-on: macos-26
    # Preserve the combined budget of the three former 20-minute jobs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Metal Toolchain
        uses: ./.github/actions/setup-metal
      - name: Build application bundle
        run: xcodebuild -project BetterTile.xcodeproj -scheme BetterTile -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Set up Metal Toolchain
        uses: ./.github/actions/setup-metal
      # Release is what ships. It resolves BETTERTILE_ENABLE_AUTOMATIC_CHECKS
      # differently from Debug, so a Debug-only build cannot catch a broken
      # release configuration.
      - name: Build release application bundle
        run: xcodebuild -project BetterTile.xcodeproj -scheme BetterTile -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      # Guards the `rm -rf` in the release tool's exit trap.
      - name: Test release workspace cleanup
        run: Tools/tests/release-workspace-test.sh
      - name: Test release dry-run key
        run: Tools/tests/release-dry-run-key-test.sh
      - name: Set up Metal Toolchain
        uses: ./.github/actions/setup-metal
      - name: Build release
        run: swift build -c release

  # A job skipped because its dependency failed reports the same "skipped"
  # conclusion as one skipped by its own condition, and a skipped required
  # check counts as passing. Always run `test` to reject failed classification
  # and require every build and test job to match that classification.
  # Add every new job to `needs` so the required check covers it.
  # Keep `always()` rather than `!cancelled()`: a cancelled run must fail this
  # check, because a skipped required check counts as passing.
  test:
    needs: [changes, guards, unit-tests, app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a successful change classification
        env:
          RESULT: ${{ needs.changes.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "The changes job ended as '$RESULT', so nothing establishes"
            echo "that this pull request is documentation only. Failing rather"
            echo "than letting the required check pass without a build."
            exit 1
          fi
      - name: Require the expected build and test results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$CODE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo "Unexpected change classification: '$CODE'."; exit 1 ;;
          esac

          # Read every job in `needs` except `changes`, so a new job only has
          # to be added to `needs`.
          unexpected=$(jq -r --arg expected "$expected" --arg event "$EVENT" \
            'to_entries[] | select(.key != "changes")
             | (if .key == "app" and $event == "push" then "skipped" else $expected end) as $wanted
             | select(.value.result != $wanted)
             | "\(.key): \(.value.result) (expected \($wanted))"' <<< "$NEEDS")
          if [ -n "$unexpected" ]; then
            echo "Unexpected build and test results:"
            echo "$unexpected"
            exit 1
          fi
          echo "Every build and test job matched its expected result."
