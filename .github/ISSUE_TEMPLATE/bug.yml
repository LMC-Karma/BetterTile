name: Bug report
description: Report incorrect BetterTile behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display and Stage Manager setup
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
