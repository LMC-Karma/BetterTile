name: Feature request
description: Propose a BetterTile capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow or limitation, not only a proposed control.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired result
      description: >-
        What should BetterTile do, and how can we tell that it works?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Permissions, privacy, or compatibility considerations
