name: Set up Metal Toolchain
description: Cache and import Apple's Metal compiler component for the selected Xcode.
runs:
  using: composite
  steps:
    - name: Identify Xcode
      id: xcode
      shell: bash
      run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - name: Restore Metal Toolchain download
      id: metal-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # version 4
      with:
        path: ${{ runner.temp }}/bettertile-metal
        key: metal-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}
    - name: Import Metal Toolchain
      shell: bash
      run: Tools/ci/setup-metal.sh "$RUNNER_TEMP/bettertile-metal"
    # Match the build-cache policy: pull requests restore but cannot save.
    - name: Save Metal Toolchain download
      if: github.event_name != 'pull_request' && steps.metal-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # version 4
      with:
        path: ${{ runner.temp }}/bettertile-metal
        key: ${{ steps.metal-cache.outputs.cache-primary-key }}
