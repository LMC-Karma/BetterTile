name: Set up Metal Toolchain
description: Cache and import Apple's Metal compiler component for the selected Xcode.
runs:
  using: composite
  steps:
    - name: Identify Xcode
      id: xcode
      shell: bash
      run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - name: Cache Metal Toolchain download
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/bettertile-metal
        key: metal-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}
    - name: Import Metal Toolchain
      shell: bash
      run: Tools/ci/setup-metal.sh "$RUNNER_TEMP/bettertile-metal"
