<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>BetterTile social preview template</title>
<link rel="stylesheet" href="redesign.css">
<style>
/* Source for assets/identity/social-preview.png. Render at 1200 × 630 and export at 1x. */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#07090d}
.card{position:relative;width:1200px;height:630px;overflow:hidden;isolation:isolate}
.card:before{content:"";position:absolute;z-index:-1;right:-120px;top:40px;width:760px;height:620px;background:radial-gradient(50% 50% at 50% 55%,rgba(49,92,244,.36),rgba(49,92,244,.1) 48%,transparent 75%);filter:blur(30px)}
.brand{position:absolute;left:72px;top:58px;display:flex;align-items:center;gap:14px;font-size:30px;font-weight:650;letter-spacing:-.03em;color:#f5f7fc}
.brand img{width:52px;height:52px}
.copy{position:absolute;left:72px;top:190px;width:560px}
.copy h1{font-size:74px;line-height:1.02;letter-spacing:-.035em;white-space:nowrap}
.copy p{margin-top:26px;font-size:24px;line-height:1.4;color:#c1cee2}
.copy small{display:block;margin-top:14px;font-size:18px;color:#8a95a9}
.desk{position:absolute;right:64px;top:132px;width:450px;height:366px;padding:12px;border:1px solid transparent;border-radius:20px;
  background:linear-gradient(180deg,#11285f,#0b1b42 46%,#0a1736) padding-box,linear-gradient(180deg,rgba(157,181,255,.45),rgba(157,181,255,.08) 42%,rgba(157,181,255,.18)) border-box;
  box-shadow:0 60px 110px -50px rgba(49,92,244,.8),0 26px 50px -24px rgba(0,0,0,.85)}
.panes{display:flex;height:100%;gap:0}
.panes .mini-win{flex:1;gap:10px;padding:34px 18px 18px;border-radius:12px}
.panes .mini-win:first-child{flex:1.25}
.panes .mini-bar{top:13px;left:15px;gap:6px}.panes .mini-bar i{width:10px;height:10px}
.panes .mini-win b{height:8px;border-radius:4px}
.grip{align-self:center;flex-shrink:0;width:8px;height:150px;margin:0 7px;background:#0a84ff;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 4px 14px rgba(10,132,255,.45)}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="assets/identity/app-icon-native-dark-128.png" alt="">BetterTile</div>
  <div class="copy">
    <h1>Your windows.<br><span>Working together.</span></h1>
    <p>A free, native window manager for macOS.</p>
    <small>Linked resizing · Adaptive tiling · Snapping</small>
  </div>
  <div class="desk"><div class="panes">
    <div class="mini-win"><span class="mini-bar"><i></i><i></i><i></i></span><b></b><b></b><b></b><b class="short"></b><b></b><b class="short"></b></div>
    <span class="grip"></span>
    <div class="mini-win"><span class="mini-bar"><i></i><i></i><i></i></span><b class="accent"></b><b></b><b></b><b class="short"></b><b></b></div>
  </div></div>
</div>
</body>
</html>
